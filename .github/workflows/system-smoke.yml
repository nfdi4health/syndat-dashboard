name: System smoke test

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "docker-compose*.yml"
      - "Makefile"
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "docker-compose*.yml"
      - "Makefile"
      - ".github/**"

jobs:
  system-smoke:
    name: Docker Compose system smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend image assets
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run system smoke test
        run: python tests/system_smoke.py
