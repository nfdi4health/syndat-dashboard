version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      # Split the web stack from the numeric stack so a blocked numeric bump
      # cannot fail an otherwise-compatible web-stack update.
      backend-web:
        patterns:
          - "aiofiles"
          - "fastapi"
          - "httpx"
          - "plotly"
          - "pydantic"
          - "pytest"
          - "python-dotenv"
          - "python-multipart"
          - "starlette"
          - "uvicorn"
      backend-numeric:
        patterns:
          - "anonymeter"
          - "matplotlib"
          - "numpy"
          - "pandas"
          - "scipy"
          - "seaborn"
          - "syndat"
    ignore:
      # scipy >= 1.18 requires numpy >= 2, but numpy is held at 1.26.4 by
      # anonymeter 1.1.0 (numpy<1.27).
      - dependency-name: scipy
        versions:
          - ">=1.18"
      # pandas 3.1+ requires numpy >= 2.0.2, which conflicts with the
      # numpy<1.27 hold imposed by anonymeter 1.1.0.
      - dependency-name: pandas
        versions:
          - ">=3.1"
      # numpy is held below 2 by anonymeter 1.1.0 (numpy<1.27).
      - dependency-name: numpy
        versions:
          - ">=2"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-docker:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-docker:
        patterns:
          - "*"
    ignore:
      # Backend deps pin numpy 1.26.4 (no cp313/cp314 wheels) and anonymeter
      # 1.1.0 requires python<3.14, so the base image must stay on 3.12.
      - dependency-name: python
        versions:
          - ">=3.13"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"